{% macro csrf() %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% endmacro %}
{% macro badge(codigo) %}
  <span class="status status-{{ codigo|lower }}">{{ estados[codigo] }}</span>
{% endmacro %}
{% macro campo(nombre,etiqueta,valores,tipo='text',extra='') %}
  <label class="field">
    <span>{{ etiqueta }}</span>
    <input name="{{ nombre }}"
           id="{{ nombre }}"
           type="{{ tipo }}"
           value="{{ valores.get(nombre,'') }}"
           {{ extra|safe }}>
  </label>
{% endmacro %}
